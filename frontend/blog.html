<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Blog - VidaFit Market
    </title>

    <link
        rel="stylesheet"
        href="css/estilos.css">

</head>

<body>


    <!-- ======================================== -->
    <!-- ENCABEZADO -->
    <!-- ======================================== -->

    <header>

        <h1>
            VidaFit Market
        </h1>

        <nav>

            <a href="index.html">
                Inicio
            </a>

            <a href="administradores.html">
                Administradores
            </a>

            <a href="usuarios.html">
                Usuarios
            </a>

            <a href="blog.html">
                Blog
            </a>

        </nav>

    </header>



    <!-- ======================================== -->
    <!-- CONTENIDO PRINCIPAL -->
    <!-- ======================================== -->

    <main>


        <h2 class="titulo-seccion">
            Gestión del Blog
        </h2>



        <!-- ======================================== -->
        <!-- FORMULARIO -->
        <!-- ======================================== -->

        <section class="formulario">


            <h3 id="tituloFormulario">
                Registrar publicación
            </h3>


            <form id="formBlog">


                <!-- ID DEL BLOG OCULTO -->

                <input
                    type="hidden"
                    id="idBlog">


                <!-- ADMINISTRADOR -->

                <input
                    type="number"
                    id="idAdmin"
                    placeholder="ID del administrador"
                    min="1"
                    value="1"
                    required>


                <!-- TÍTULO -->

                <input
                    type="text"
                    id="titulo"
                    placeholder="Título de la publicación"
                    maxlength="200"
                    required>


                <!-- CONTENIDO -->

                <textarea
                    id="contenido"
                    placeholder="Contenido de la publicación"
                    rows="8"
                    required>
                </textarea>

<!-- CATEGORÍA -->

<label for="categoria">Categoría</label>

<select id="categoria" required>
    <option value="">Seleccione una categoría</option>
    <option value="Humanos">Nutrición para humanos</option>
    <option value="Mascotas">Bienestar de mascotas</option>
    <option value="General">Información general</option>
</select>
                <!-- FECHA -->

                <input
                    type="date"
                    id="fechaPublicacion"
                    required>


                <!-- GUARDAR -->

                <button
                    type="submit"
                    id="btnGuardar">

                    Guardar publicación

                </button>


                <!-- LIMPIAR -->

                <button
                    type="button"
                    id="btnLimpiar">

                    Limpiar

                </button>


            </form>

        </section>



        <!-- ======================================== -->
        <!-- LISTA DE PUBLICACIONES -->
        <!-- ======================================== -->

        <section>


            <h3 class="titulo-seccion">
                Lista de Publicaciones
            </h3>


            <table class="tabla">

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Administrador</th>

                        <th>Título</th>

                        <th>Contenido</th>

                        <th>Fecha</th>

                        <th>Acciones</th>

                    </tr>

                </thead>


                <tbody id="tablaBlogs">

                    <tr>

                        <td colspan="6">

                            Cargando publicaciones...

                        </td>

                    </tr>

                </tbody>

            </table>


        </section>


    </main>



    <!-- ======================================== -->
    <!-- PIE DE PÁGINA -->
    <!-- ======================================== -->

    <footer>

        <p>
            © 2026 VidaFit Market
        </p>

    </footer>



    <!-- ======================================== -->
    <!-- JAVASCRIPT -->
    <!-- ======================================== -->

   <script src="js/blog.js"></script>
<script src="js/seguridad.js"></script>
<script src="js/menu.js"></script>

</body>
</html>
