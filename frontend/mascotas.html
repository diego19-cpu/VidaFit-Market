<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Mascotas - VidaFit Market
    </title>

    <link
        rel="stylesheet"
        href="css/estilos.css">


    <style>

        .formulario select {

            width: 100%;

            box-sizing: border-box;

            padding: 12px;

            margin-bottom: 12px;

            border: 1px solid #cccccc;

            border-radius: 8px;

            font-size: 15px;

        }

    </style>

</head>


<body>


    <!-- ========================================= -->
    <!-- ENCABEZADO -->
    <!-- ========================================= -->

    <header>

        <h1>
            VidaFit Market
        </h1>


        <nav>

            <a href="index.html">
                Inicio
            </a>

            <a href="administradores.html">
                Administradores
            </a>

            <a href="usuarios.html">
                Usuarios
            </a>

            <a href="productos.html">
                Productos
            </a>

            <a href="mascotas.html">
                Mascotas
            </a>

            <a href="blog.html">
                Blog
            </a>

        </nav>

    </header>



    <!-- ========================================= -->
    <!-- CONTENIDO PRINCIPAL -->
    <!-- ========================================= -->

    <main>


        <h2 class="titulo-seccion">
            Gestión de Mascotas
        </h2>



        <!-- ========================================= -->
        <!-- FORMULARIO -->
        <!-- ========================================= -->

        <section class="formulario">


            <h3 id="tituloFormulario">
              Registrar mascota
            </h3>


            <form id="formMascota">


                <!-- ID OCULTO -->

                <input
                    type="hidden"
                    id="idMascota">



                <!-- PROPIETARIO -->

                <select
                    id="idUsuario"
                    required>


                    <option value="">

                        Cargando usuarios...

                    </option>


                </select>



                <!-- NOMBRE -->

                <input
                    type="text"
                    id="nombre"
                    placeholder="Nombre de la mascota"
                    maxlength="100"
                    required>



                <!-- RAZA -->

                <input
                    type="text"
                    id="raza"
                    placeholder="Raza de la mascota"
                    maxlength="100"
                    required>



                <!-- EDAD -->

                <input
                    type="number"
                    id="edad"
                    placeholder="Edad en años"
                    min="0"
                    step="1"
                    required>



                <!-- PESO -->

                <input
                    type="number"
                    id="peso"
                    placeholder="Peso en kilogramos"
                    min="0"
                    step="0.01"
                    required>



                <!-- NECESIDAD -->

                <select
                    id="necesidad"
                    required>


                    <option value="">

                        Seleccione la necesidad nutricional

                    </option>


                    <option value="Bienestar general">

                        Bienestar general

                    </option>


                    <option value="Control de peso">

                        Control de peso

                    </option>


                    <option value="Cuidado articular">

                        Cuidado articular

                    </option>


                    <option value="Salud digestiva">

                        Salud digestiva

                    </option>


                    <option value="Piel y pelaje">

                        Piel y pelaje

                    </option>


                    <option value="Energía y vitalidad">

                        Energía y vitalidad

                    </option>


                    <option value="Fortalecimiento nutricional">

                        Fortalecimiento nutricional

                    </option>


                </select>



                <!-- GUARDAR -->

                <button
                    type="submit"
                    id="btnGuardar">

                    Guardar mascota

                </button>



                <!-- LIMPIAR -->

                <button
                    type="button"
                    id="btnLimpiar">

                    Limpiar

                </button>


            </form>


        </section>



        <!-- ========================================= -->
        <!-- LISTA DE MASCOTAS -->
        <!-- ========================================= -->

        <section>


            <h3 class="titulo-seccion">
                Lista de Mascotas
            </h3>


            <div style="overflow-x: auto;">


                <table class="tabla">


                    <thead>


                        <tr>


                            <th>
                                ID
                            </th>


                            <th>
                                Propietario
                            </th>


                            <th>
                                Nombre
                            </th>


                            <th>
                                Raza
                            </th>


                            <th>
                                Edad
                            </th>


                            <th>
                                Peso
                            </th>


                            <th>
                                Necesidad
                            </th>


                            <th>
                                Acciones
                            </th>


                        </tr>


                    </thead>



                    <tbody id="tablaMascotas">


                        <tr>


                            <td colspan="8">

                                Cargando mascotas...

                            </td>


                        </tr>


                    </tbody>


                </table>


            </div>


        </section>


    </main>



    <!-- ========================================= -->
    <!-- PIE DE PÁGINA -->
    <!-- ========================================= -->

    <footer>

        <p>
            © 2026 VidaFit Market
        </p>

    </footer>



    <!-- ========================================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================================= -->

 <script src="js/mascotas.js"></script>
<script src="js/seguridad.js"></script>
<script src="js/menu.js"></script>

</body>
</html>
