<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Blog Público - VidaFit Market
    </title>

    <link
        rel="stylesheet"
        href="css/estilos.css"
    >

</head>


<body>


    <!-- ENCABEZADO -->

    <header>

        <h1>
            VidaFit Market
        </h1>

    </header>



    <main>


        <!-- TÍTULO PRINCIPAL -->

        <h2 class="titulo-seccion">

            Blog de Bienestar y Nutrición

        </h2>


        <p style="text-align: center;">

            Información para el bienestar y la nutrición de personas y mascotas.

        </p>



        <!-- FILTRO DE ARTÍCULOS -->

        <section class="formulario">


            <h3>
                Consultar artículos
            </h3>


            <label for="filtroPublico">

                Seleccione un tema:

            </label>


            <select id="filtroPublico">


                <option value="Todos">

                    Todos los artículos

                </option>


                <option value="Humanos">

                    Nutrición para humanos

                </option>


                <option value="Mascotas">

                    Nutrición para mascotas 

                </option>


                <option value="General">

                    Información general

                </option>


            </select>


        </section>



        <!-- LISTA DE ARTÍCULOS -->

        <section>


            <h3 class="titulo-seccion">

                Artículos

            </h3>


            <div id="listaArticulos">


                <p style="text-align: center;">

                    Cargando artículos...

                </p>


            </div>


        </section>


    </main>



    <!-- PIE DE PÁGINA -->

    <footer>

        <p>

            © 2026 VidaFit Market

        </p>

    </footer>



    <!-- JAVASCRIPT -->

<script src="js/blogpublico.js"></script>
<script src="js/menu.js"></script>

</body>
</html>
